<meta charset="UTF-8">
<script>
	try {
		(function () {
			const saved_theme = localStorage.getItem('site-theme');
			const prefers_dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
			const theme = saved_theme === 'dark' || saved_theme === 'light' ? saved_theme : (prefers_dark ? 'dark' : 'light');
			document.documentElement.setAttribute('data-bs-theme', theme);
		})();
	} catch (error) {
		document.documentElement.setAttribute('data-bs-theme', 'dark');
	}
</script>
{% assign page_lang = site.data.lang[page.language] | default: site.data.lang.zh_CN %}
<title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ page_lang.navibar.title }}</title>
<meta name="description" content="{{ page.description | default: page_lang.description | escape }}">
<link rel="shortcut icon" href="/assets/favicon.ico">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v=20261028-usability">
<link rel="stylesheet" href="/assets/css/tables.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
