<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <title>404 - 页面未找到 | KCISEC</title>
  {% include head.html %}
  <style>
    /* 现代极简 · 复用 main.css 的全局 design token（--bg/--brand/--surface 等） */
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text);
      text-align: center;
      padding: 2rem;
      position: relative;
    }

    .error-container {
      position: relative;
      z-index: 1;
      max-width: 480px;
    }

    .error-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.7;
    }

    .error-code {
      font-size: clamp(6rem, 15vw, 10rem);
      font-weight: 800;
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg, var(--brand) 0%, var(--brand-strong) 50%, var(--text-soft) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
    }

    .error-message {
      font-size: 1.25rem;
      color: var(--text-soft);
      margin: 0.8rem 0 2rem;
      line-height: 1.6;
    }

    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow-sm);
      transition: all 0.25s var(--ease);
    }

    .error-btn:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
      background: var(--brand-soft);
      color: var(--text);
      box-shadow: var(--shadow);
    }

    .error-btn.primary {
      background: linear-gradient(135deg, var(--brand), var(--brand-strong));
      color: var(--brand-contrast);
      border-color: transparent;
    }

    .error-btn.primary:hover {
      filter: brightness(1.06);
      background: linear-gradient(135deg, var(--brand), var(--brand-strong));
      color: var(--brand-contrast);
    }

    .error-hint {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .error-hint a {
      color: var(--brand);
      text-decoration: none;
    }

    .error-hint a:hover {
      color: var(--brand-strong);
    }
  </style>
</head>

<body>
  <div class="error-container">
    <div class="error-icon">🔍</div>
    <h1 class="error-code">404</h1>
    <p class="error-message">抱歉，您访问的页面不存在或已被移除。</p>
    <div class="error-actions">
      <a href="/" class="error-btn primary">
        <i class="fas fa-home"></i>
        <span>返回首页</span>
      </a>
      <a href="javascript:history.back()" class="error-btn">
        <i class="fas fa-arrow-left"></i>
        <span>返回上页</span>
      </a>
    </div>
    <p class="error-hint">
      如果您认为这是一个错误，请 <a href="mailto:EricStone2009@163.com">联系我们</a>
    </p>
  </div>
</body>

</html>
