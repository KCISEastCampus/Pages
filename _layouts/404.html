<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="UTF-8">
  <title>404 - 页面未找到 | KCISEC</title>
  {% include head.html %}
  <style>
    body {
      font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(1000px 500px at -8% -15%, rgba(0, 201, 255, 0.18), transparent 55%),
        radial-gradient(800px 450px at 110% 10%, rgba(180, 89, 255, 0.18), transparent 52%),
        linear-gradient(180deg, #090f1d 0%, #0c1427 42%, #0d1830 100%);
      color: #ecf2ff;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 80%, rgba(0, 201, 255, 0.08) 0%, transparent 42%),
        radial-gradient(circle at 80% 20%, rgba(180, 89, 255, 0.08) 0%, transparent 44%);
      pointer-events: none;
      z-index: 0;
    }

    .error-container {
      position: relative;
      z-index: 1;
      max-width: 480px;
    }

    .error-code {
      font-size: clamp(6rem, 15vw, 10rem);
      font-weight: 800;
      line-height: 1;
      margin: 0;
      background: linear-gradient(135deg, #73d7ff 0%, #b293ff 50%, #8ee6ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
      text-shadow: none;
      animation: pulse-glow 3s ease-in-out infinite;
    }

    @keyframes pulse-glow {
      0%, 100% { filter: brightness(1); }
      50% { filter: brightness(1.15); }
    }

    .error-icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.7;
    }

    .error-message {
      font-size: 1.25rem;
      color: #c4d0ea;
      margin: 0.8rem 0 2rem;
      line-height: 1.6;
    }

    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.5rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      border: 1px solid rgba(136, 214, 255, 0.2);
      background: rgba(20, 30, 53, 0.9);
      color: #e5efff;
      backdrop-filter: blur(8px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.26);
    }

    .error-btn:hover {
      background: rgba(29, 48, 84, 0.98);
      border-color: rgba(136, 214, 255, 0.36);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.33);
      transform: translateY(-2px);
    }

    .error-btn.primary {
      background: linear-gradient(135deg, rgba(7, 158, 203, 0.82), rgba(90, 59, 191, 0.84));
      border-color: rgba(173, 220, 255, 0.26);
    }

    .error-btn.primary:hover {
      box-shadow: 0 12px 30px rgba(7, 158, 203, 0.3);
    }

    .error-hint {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: #8a97b5;
    }

    .error-hint a {
      color: #88d6ff;
      text-decoration: none;
    }

    .error-hint a:hover {
      color: #b39dff;
    }

    /* Floating decorative elements */
    .float-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
      animation: float 8s ease-in-out infinite;
    }

    .float-orb:nth-child(1) {
      width: 120px;
      height: 120px;
      background: radial-gradient(circle, rgba(0, 201, 255, 0.12), transparent 70%);
      top: 15%;
      left: 10%;
      animation-delay: 0s;
    }

    .float-orb:nth-child(2) {
      width: 80px;
      height: 80px;
      background: radial-gradient(circle, rgba(180, 89, 255, 0.1), transparent 70%);
      bottom: 20%;
      right: 12%;
      animation-delay: -3s;
    }

    .float-orb:nth-child(3) {
      width: 60px;
      height: 60px;
      background: radial-gradient(circle, rgba(255, 211, 76, 0.08), transparent 70%);
      top: 60%;
      left: 20%;
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-20px) scale(1.05); }
    }

    @media (prefers-reduced-motion: reduce) {
      .error-code, .float-orb { animation: none; }
    }
  </style>
</head>

<body>
  <div class="float-orb"></div>
  <div class="float-orb"></div>
  <div class="float-orb"></div>

  <div class="error-container">
    <div class="error-icon">🔍</div>
    <h1 class="error-code">404</h1>
    <p class="error-message">抱歉，您访问的页面不存在或已被移除。</p>
    <div class="error-actions">
      <a href="/" class="error-btn primary">
        <i class="fas fa-home"></i>
        <span>返回首页</span>
      </a>
      <a href="javascript:history.back()" class="error-btn">
        <i class="fas fa-arrow-left"></i>
        <span>返回上页</span>
      </a>
    </div>
    <p class="error-hint">
      如果您认为这是一个错误，请 <a href="mailto:EricStone2009@163.com">联系我们</a>
    </p>
  </div>
</body>

</html>
