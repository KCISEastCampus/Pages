<!DOCTYPE html>
<html lang="{{ page.language }}">

  <head>
    {% include head.html %}
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Segoe UI'
        , Tahoma
        , Geneva
        , Verdana
        , sans-serif;
        background: linear-gradient(-45deg, #0a0a1a, #1a1a2e, #16213e, #0f3460);
        background-size: 400% 400%;
        animation: gradient-shift 15s ease infinite;
        color: #e0e0e0;
        min-height: 100vh;
        overflow-x: hidden;
        width: 100%;
        position: relative;
      }

      @keyframes gradient-shift {
        0% {
          background-position: 0 50%;
        }
        50% {
          background-position: 100% 50%;
        }
        100% {
          background-position: 0 50%;
        }
      }

      /* 棋盘背景 */
      body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 20% 80%, rgba(102, 126, 234, 0.08) 0%, transparent 50%), radial-gradient(circle at 80% 20%, rgba(255, 215, 0, 0.06) 0%, transparent 50%), repeating-linear-gradient(0deg, transparent, transparent 50px, rgba(255, 215, 0, 0.02) 50px, rgba(255, 215, 0, 0.02) 100px), repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(255, 215, 0, 0.02) 50px, rgba(255, 215, 0, 0.02) 100px);
        pointer-events: none;
        z-index: -1;
      }

      /* 棋子装饰 */
      body::after {
        content: '♔ ♕ ♖ ♗ ♘ ♙';
        position: fixed;
        bottom: -30px;
        right: -30px;
        font-size: 140px;
        color: rgba(255, 215, 0, 0.06);
        pointer-events: none;
        z-index: 0;
        white-space: nowrap;
        font-weight: bold;
      }

      /* 简洁的页头 */
      .header {
        background: linear-gradient(135deg, rgba(26, 26, 46, 0.9) 0%, rgba(22, 33, 62, 0.9) 50%, rgba(15, 52, 96, 0.9) 100%);
        backdrop-filter: blur(20px);
        padding: 30px 20px;
        border-bottom: 2px solid rgba(255, 215, 0, 0.2);
        position: sticky;
        top: 0;
        z-index: 100;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        animation: header-slide-down 0.5s ease-out;
      }

      @keyframes header-slide-down {
        from {
          transform: translateY(-100%);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      .header::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        animation: header-shimmer 3s infinite;
        pointer-events: none;
      }

      @keyframes header-shimmer {
        0% {
          left: -100%;
        }
        100% {
          left: 100%;
        }
      }

      .header-content {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .back-link a {
        color: #b8c5d1;
        text-decoration: none;
        font-size: 0.95em;
        transition: all 0.3s ease;
        padding: 8px 16px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.05);
        display: inline-block;
        position: relative;
        overflow: hidden;
      }

      .back-link a::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
        transition: left 0.4s ease;
        z-index: 1;
      }

      .back-link a > * {
        position: relative;
        z-index: 2;
      }

      .back-link a:hover {
        color: #ffd700;
        background: rgba(255, 215, 0, 0.1);
        border-color: rgba(255, 215, 0, 0.3);
        box-shadow: 0 4px 12px rgba(255, 215, 0, 0.15);
        transform: translateY(-2px);
      }

      .back-link a:hover::before {
        left: 100%;
      }

      .header h1 {
        color: #ffffff;
        font-size: 2em;
        font-weight: 400;
        letter-spacing: 1px;
      }

      .header h1 span {
        color: #ffd700;
        font-weight: 600;
      }

      /* 主容器 */
      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
        width: 100%;
        box-sizing: border-box;
        animation: fade-in 0.5s ease-out;
      }

      @keyframes fade-in {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* 规则区域 - 可折叠 */
      .rules-toggle {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 40px;
        cursor: default;
        transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
      }

      .rules-toggle::before {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: linear-gradient(180deg, #ffd700, #ffed4e);
        opacity: 0;
        transition: opacity 0.3s ease;
      }

      .rules-toggle::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
        transition: left 0.5s ease;
        z-index: 0;
        pointer-events: none;
      }

      .rules-toggle:hover {
        background: rgba(255, 255, 255, 0.1);
        border-color: rgba(255, 255, 255, 0.18);
        box-shadow: 0 12px 35px rgba(0, 0, 0, 0.25);
        transform: translateY(-2px);
      }

      .rules-toggle:hover::before {
        opacity: 1;
      }

      .rules-toggle:hover::after {
        left: 100%;
      }

      .rules-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        transition: all 0.3s;
      }

      .rules-header:hover {
        opacity: 0.8;
      }

      .rules-header h2 {
        color: #ffd700;
        font-size: 1.3em;
        font-weight: 500;
        margin: 0;
      }

      .rules-icon {
        color: #b8c5d1;
        transition: transform 0.3s;
      }

      .rules-icon.expanded {
        transform: rotate(180deg);
      }

      .rules-content {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.35s ease-in-out
        , padding 0.35s ease-in-out;
        padding-top: 0;
        font-size: 1.05em;
      }

      .rules-content.expanded {
        max-height: 600px;
        padding-top: 20px;
        overflow-y: auto;
        overflow-x: hidden;
      }

      /* 美化滚动条 */
      .rules-content.expanded::-webkit-scrollbar {
        width: 8px;
      }

      .rules-content.expanded::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
      }

      .rules-content.expanded::-webkit-scrollbar-thumb {
        background: rgba(102, 126, 234, 0.4);
        border-radius: 10px;
      }

      .rules-content.expanded::-webkit-scrollbar-thumb:hover {
        background: rgba(102, 126, 234, 0.6);
      }

      .rules-content h2 {
        font-size: 1.3em;
        font-weight: 600;
        color: #b8c5d1;
        margin-bottom: 20px;
        margin-top: 0;
      }

      .rules-content p {
        line-height: 2;
        color: #d0d0d0;
        margin-bottom: 12px;
        letter-spacing: 0.3px;
        transition: color 0.3s ease;
      }

      .rules-content p:hover {
        color: #e8e8e8;
      }

      .rules-content ol {
        padding-left: 40px;
        margin: 10px 0;
      }

      .rules-content li {
        line-height: 2.2;
        color: #d0d0d0;
        margin-bottom: 16px;
        letter-spacing: 0.3px;
        position: relative;
        padding-left: 8px;
        transition: all 0.3s ease;
      }

      .rules-content li:hover {
        color: #e8e8e8;
        padding-left: 16px;
        border-left: 2px solid rgba(0, 159, 168, 0.5);
      }

      .rules-content li p {
        margin: 0;
      }

      .rules-content strong {
        color: #00ffa8;
        font-weight: 600;
      }

      /* 时间轴容器 */
      .timeline {
        position: relative;
        margin: 40px 0;
      }

      .timeline::before {
        content: '';
        position: absolute;
        left: 30px;
        top: 0;
        bottom: 0;
        width: 2px;
        background: linear-gradient(to bottom, transparent, rgba(255, 215, 0, 0.3), transparent);
      }

      /* 时间分组 */
      .time-group {
        margin-bottom: 60px;
      }

      .time-label {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        background: linear-gradient(45deg, #ffd700, #ffed4e);
        color: #1a1a2e;
        padding: 10px 25px;
        border-radius: 25px;
        font-weight: 600;
        font-size: 1.1em;
        margin-bottom: 30px;
        margin-left: 60px;
        box-shadow: 0 4px 15px rgba(255, 215, 0, 0.3);
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
      }

      .time-label::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        animation: shimmer 3s infinite;
      }

      .time-label:hover {
        box-shadow: 0 6px 25px rgba(255, 215, 0, 0.5);
        transform: translateY(-2px);
      }

      /* 正在进行的比赛标签 */
      .running-group .time-label {
        background: linear-gradient(135deg, rgba(52, 211, 153, 0.2), rgba(34, 197, 94, 0.15));
        color: #10b981;
        border: 1px solid rgba(16, 185, 129, 0.4);
        box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
        animation: pulse-glow 2s ease-in-out infinite;
      }

      @keyframes pulse-glow {
        0,
        100% {
          box-shadow: 0 4px 20px rgba(16, 185, 129, 0.25);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
          transform: scale(1.02);
        }
      }

      /* 比赛卡片 */
      .match-item {
        position: relative;
        margin-bottom: 30px;
        padding-left: 80px;
        animation: slide-in-left 0.5s ease-out;
        animation-fill-mode: both;
      }

      .match-item:nth-child(1) {
        animation-delay: 0s;
      }

      .match-item:nth-child(2) {
        animation-delay: 0.1s;
      }

      .match-item:nth-child(3) {
        animation-delay: 0.2s;
      }

      .match-item:nth-child(n + 4) {
        animation-delay: 0.3s;
      }

      @keyframes slide-in-left {
        from {
          opacity: 0;
          transform: translateX(-20px);
        }
        to {
          opacity: 1;
          transform: translateX(0);
        }
      }

      .series-extra {
        margin-top: 10px;
        max-height: 2000px;
        overflow: hidden;
        transition: max-height 0.35s ease-in-out
        , opacity 0.35s ease-in-out;
        opacity: 1;
      }

      .series-extra.hidden {
        max-height: 0;
        opacity: 0;
      }

      /* 卡片内的展开链接区域 */
      .card-extras-footer {
        border-top: 1px solid rgba(102, 224, 255, 0.2);
        padding-top: 12px;
        margin-top: 12px;
      }

      .card-toggle-link {
        background: linear-gradient(135deg, rgba(102, 224, 255, 0.12), rgba(0, 212, 255, 0.1));
        border: 1px solid rgba(102, 224, 255, 0.4);
        color: #a8f3ff;
        padding: 8px 14px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 0.85em;
        letter-spacing: 0.3px;
        border-radius: 8px;
        text-decoration: none;
        transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        overflow: hidden;
      }

      .card-toggle-link::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
        transition: left 0.5s ease;
        z-index: 1;
      }

      .card-toggle-link > * {
        position: relative;
        z-index: 2;
      }

      .card-toggle-link:hover {
        background: linear-gradient(135deg, rgba(102, 224, 255, 0.2), rgba(0, 212, 255, 0.18));
        border-color: rgba(102, 224, 255, 0.65);
        color: #e5fbff;
        box-shadow: 0 6px 18px rgba(102, 224, 255, 0.25);
        transform: translateY(-2px);
      }

      .card-toggle-link:hover::before {
        left: 100%;
      }

      .card-toggle-link[data-expanded="true"] {
        background: linear-gradient(135deg, rgba(255, 216, 117, 0.15), rgba(255, 198, 95, 0.12));
        border-color: rgba(255, 216, 117, 0.5);
        color: #ffe7aa;
      }

      .card-toggle-link[data-expanded="true"]:hover {
        background: linear-gradient(135deg, rgba(255, 216, 117, 0.25), rgba(255, 198, 95, 0.2));
        border-color: rgba(255, 216, 117, 0.7);
        box-shadow: 0 6px 18px rgba(255, 198, 95, 0.25);
        transform: translateY(-2px);
      }

      /* 动态 icon 样式 */
      .card-icon {
        position: absolute;
        top: 10px;
        right: 15px;
        font-size: 1.2em;
        opacity: 0.7;
      }

      .match-card.type-pro .card-icon {
        color: rgba(0, 212, 255, 0.6);
      }

      .match-card.type-champions .card-icon {
        color: rgba(255, 215, 0, 0.8);
        font-size: 1.3em;
      }

      .match-marker {
        position: absolute;
        left: 22px;
        top: 20px;
        width: 18px;
        height: 18px;
        background: #ffd700;
        border: 3px solid #1a1a2e;
        border-radius: 50%;
        box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.2);
        z-index: 2;
        animation: marker-pulse 2s ease-in-out infinite;
      }

      @keyframes marker-pulse {
        0,
        100% {
          box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.2);
          transform: scale(1);
        }
        50% {
          box-shadow: 0 0 12px 8px rgba(255, 215, 0, 0.15);
          transform: scale(1.1);
        }
      }

      .match-card {
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(15px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 15px;
        padding: 25px 25px 10px;
        transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        overflow: hidden;
      }

      .match-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: #667eea;
        transition: all 0.3s ease;
      }

      .match-card::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        transition: left 0.5s ease;
        z-index: 1;
        pointer-events: none;
      }

      .match-card > * {
        position: relative;
        z-index: 2;
      }

      .match-card:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(102, 126, 234, 0.6);
        transform: translateY(-5px);
        box-shadow: 0 10px 30px rgba(102, 126, 234, 0.2);
      }

      .match-card:hover::before {
        height: 4px;
        box-shadow: 0 0 15px rgba(102, 126, 234, 0.5);
      }

      .match-card:hover::after {
        left: 100%;
      }

      /* 正在进行的比赛卡片特殊样式 */
      .running-group .match-card::before {
        background: linear-gradient(90deg, #10b981, #34d399);
        box-shadow: 0 0 15px rgba(16, 185, 129, 0.5);
      }

      .running-group .match-card {
        border: 1px solid rgba(16, 185, 129, 0.3);
        background: rgba(16, 185, 129, 0.08);
      }

      .running-group .match-card:hover {
        border-color: rgba(16, 185, 129, 0.6);
        background: rgba(16, 185, 129, 0.12);
        box-shadow: 0 12px 35px rgba(16, 185, 129, 0.25);
        transform: translateY(-6px) scale(1.01);
      }

      .running-group .match-card:hover::before {
        box-shadow: 0 0 20px rgba(16, 185, 129, 0.8);
      }

      /* E.C. 系列 - 青铜级 */
      .match-card.type-ec::before {
        background: #cd7f32;
        box-shadow: 0 0 12px rgba(205, 127, 50, 0.4);
      }

      .match-card.type-ec {
        border-color: rgba(205, 127, 50, 0.25);
      }

      .match-card.type-ec:hover {
        border-color: rgba(205, 127, 50, 0.5);
        background: rgba(205, 127, 50, 0.08);
        box-shadow: 0 12px 30px rgba(205, 127, 50, 0.2);
      }

      /* PRO LEAGUE 系列 - 白银升级版（蓝紫渐变+发光） */
      .match-card.type-pro::before {
        background: linear-gradient(90deg, #00d4ff, #0099ff);
        box-shadow: 0 0 15px rgba(0, 212, 255, 0.6);
      }

      .match-card.type-pro {
        border: 1px solid rgba(0, 212, 255, 0.35);
        background: rgba(0, 212, 255, 0.07);
      }

      .match-card.type-pro:hover {
        border-color: rgba(0, 212, 255, 0.6);
        background: rgba(0, 212, 255, 0.11);
        box-shadow: 0 12px 35px rgba(0, 212, 255, 0.25);
        transform: translateY(-6px) scale(1.01);
      }

      .match-card.type-pro:hover::before {
        box-shadow: 0 0 20px rgba(0, 212, 255, 0.8);
      }

      /* Champions 系列 - 黄金级（发光强化） */
      .match-card.type-champions::before {
        background: linear-gradient(90deg, #ffd700, #ffed4e);
        box-shadow: 0 0 18px rgba(255, 215, 0, 0.7);
      }

      .match-card.type-champions {
        border: 1px solid rgba(255, 215, 0, 0.4);
        background: rgba(255, 215, 0, 0.09);
      }

      .match-card.type-champions:hover {
        border-color: rgba(255, 215, 0, 0.7);
        background: rgba(255, 215, 0, 0.13);
        box-shadow: 0 12px 40px rgba(255, 215, 0, 0.3);
        transform: translateY(-6px) scale(1.01);
      }

      .match-card.type-champions:hover::before {
        box-shadow: 0 0 25px rgba(255, 215, 0, 1);
      }

      /* 特殊活动样式 - 粉红发光 */
      .match-card.type-special::before {
        background: linear-gradient(90deg, #ff1493, #ff69b4);
        box-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
      }

      .match-card.type-special {
        border-color: rgba(255, 20, 147, 0.3);
      }

      .match-card.type-special:hover {
        border-color: rgba(255, 20, 147, 0.5);
        background: rgba(255, 20, 147, 0.05);
        box-shadow: inset 0 0 20px rgba(255, 20, 147, 0.1);
      }
      .match-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 15px;
        flex-wrap: wrap;
        gap: 15px;
      }

      .match-title {
        flex: 1;
        min-width: 200px;
      }

      .match-title h3 {
        color: #ffffff;
        font-size: 1.3em;
        font-weight: 500;
        margin-bottom: 8px;
      }

      .match-time {
        color: #b8c5d1;
        font-size: 0.95em;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .match-time::before {
        content: '🕐';
      }

      .match-action {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .match-btn {
        padding: 10px 24px;
        border-radius: 8px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.95em;
        transition: all 0.3s;
        border: none;
        cursor: pointer;
      }

      .match-btn.primary {
        background: linear-gradient(45deg, #667eea, #764ba2);
        color: white;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
      }

      .match-btn.primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
      }

      .match-btn.secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #b8c5d1;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .match-btn.secondary:hover {
        background: rgba(255, 255, 255, 0.15);
      }

      /* 奖金信息 */
      .prize-info {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin: 15px 0;
      }

      .prize-badge {
        background: linear-gradient(45deg, rgba(255, 215, 0, 0.2), rgba(255, 215, 0, 0.1));
        border: 1px solid rgba(255, 215, 0, 0.3);
        color: #ffd700;
        padding: 6px 14px;
        border-radius: 20px;
        font-size: 0.9em;
        font-weight: 600;
      }

      /* 获奖者信息 */
      .winners {
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
      }

      .winners-title {
        color: #ffd700;
        font-size: 0.95em;
        font-weight: 600;
        margin-bottom: 10px;
      }

      .winner-item {
        background: rgba(255, 215, 0, 0.1);
        border-left: 3px solid #ffd700;
        padding: 8px 12px;
        margin: 6px 0;
        border-radius: 4px;

    <script>
      // 页面加载时确保规则初始收起
      document.addEventListener('DOMContentLoaded', function() {
        const rulesContent = document.getElementById('rulesContent');
        const rulesIcon = document.getElementById('rulesIcon');
        
        // 移除展开状态
        rulesContent.classList.remove('expanded');
        rulesIcon.classList.remove('expanded');
        
        // 填充快速信息卡片
        populateQuickInfo();
        
        // 每分钟更新一次快速信息（更新倒计时）
        setInterval(() => {
          populateQuickInfo();
        }, 60000); // 60秒
      });
      
      // 填充快速信息（显示最近3场即将开始的比赛）
      function populateQuickInfo() {
        const quickInfoContent = document.getElementById('quickInfoContent');
        const quickInfoTitle = document.getElementById('quickInfoTitle');
        if (!quickInfoContent) {
          console.log('Quick info content element not found');
          return;
        }
        
        console.log('Populating quick info, globalMatches length:', globalMatches.length);
        
        try {
          // 获取即将开始和正在进行的比赛
          const now = new Date();
          const relevantMatches = [];
          
          console.log('Current time:', now.toLocaleString('zh-CN'));
          
          // 从全局 matches 中筛选
          if (globalMatches && globalMatches.length > 0) {
            globalMatches.forEach(match => {
              const startTime = parseMatchDate(match.startTime);
              const endTime = parseMatchDate(match.endTime);
              
              console.log(`Match: ${match.name}, Start: ${startTime.toLocaleString('zh-CN')}, End: ${endTime.toLocaleString('zh-CN')}`);
              
              // 包含：正在进行的比赛 或 即将开始的比赛（未来7天内）
              const isOngoing = startTime <= now && now < endTime;
              const isUpcoming = startTime > now && (startTime - now) < (7 * 24 * 60 * 60 * 1000);
              
              console.log(`  isOngoing: ${isOngoing}, isUpcoming: ${isUpcoming}`);
              
              if (isOngoing || isUpcoming) {
                relevantMatches.push({
                  name: match.name,
                  startTime: startTime,
                  endTime: endTime,
                  match: match,
                  isOngoing: isOngoing
                });
              }
            });
          } else {
            console.log('No matches available');
          }
          
          console.log('Relevant matches found:', relevantMatches.length);
          
          // 按优先级排序：正在进行的优先，然后按开始时间排序
          relevantMatches.sort((a, b) => {
            if (a.isOngoing && !b.isOngoing) return -1;
            if (!a.isOngoing && b.isOngoing) return 1;
            return a.startTime - b.startTime;
          });
          
          const topMatches = relevantMatches.slice(0, 3);
          
          if (topMatches.length === 0) {
            quickInfoContent.innerHTML = '<div class="quick-no-matches">暂无即将开始的比赛</div>';
            if (quickInfoTitle) quickInfoTitle.textContent = '近期比赛';
            return;
          }
          
          // 分组：正在进行 vs 即将开始
          const ongoingMatches = topMatches.filter(m => m.isOngoing);
          const upcomingMatches = topMatches.filter(m => !m.isOngoing);
          
          // 动态更新标题和图标
          const hasOngoing = ongoingMatches.length > 0;
          const quickInfoIcon = document.querySelector('.quick-info-icon');
          
          if (quickInfoTitle) {
            if (hasOngoing && upcomingMatches.length > 0) {
              quickInfoTitle.textContent = '近期比赛';
              if (quickInfoIcon) quickInfoIcon.textContent = '📅';
            } else if (hasOngoing) {
              quickInfoTitle.textContent = '正在进行';
              if (quickInfoIcon) quickInfoIcon.textContent = '🔴';
            } else {
              quickInfoTitle.textContent = '即将开始';
              if (quickInfoIcon) quickInfoIcon.textContent = '⚡';
            }
          }
          
          // 生成HTML
          let html = '';
          
          // 先显示正在进行的
          if (ongoingMatches.length > 0) {
            ongoingMatches.forEach((item) => {
              const timeStr = formatQuickTime(item.startTime);
              const link = item.match.link || '#';
              
              html += `
                <a href="${link}" target="_blank" class="quick-match-item ongoing" title="点击查看比赛详情">
                  <div class="quick-match-name">${item.name}</div>
                  <div class="quick-match-time">
                    ${timeStr}
                    <span class="quick-match-badge" style="background: rgba(16, 185, 129, 0.25); color: #10b981; font-weight: 600;">● 进行中</span>
                  </div>
                </a>
              `;
            });
            
            // 如果两种都有，添加分隔线
            if (upcomingMatches.length > 0) {
              html += '<div class="quick-info-divider" data-label="即将开始"></div>';
            }
          }
          
          // 再显示即将开始的
          upcomingMatches.forEach((item) => {
            const timeStr = formatQuickTime(item.startTime);
            const countdown = getCountdown(item.startTime);
            const link = item.match.link || '#';
            
            console.log(`Upcoming match: ${item.name}, countdown: ${countdown}, startTime: ${item.startTime}`);
            
            html += `
              <a href="${link}" target="_blank" class="quick-match-item upcoming" title="点击查看比赛详情">
                <div class="quick-match-name">${item.name}</div>
                <div class="quick-match-time">
                  ${timeStr}
                  ${countdown ? `<span class="quick-match-badge">${countdown}</span>` : ''}
                </div>
              </a>
            `;
          });
          
          quickInfoContent.innerHTML = html;
          console.log('Quick info populated successfully');
        } catch (error) {
          console.error('Error populating quick info:', error);
          quickInfoContent.innerHTML = '<div class="quick-no-matches">加载失败</div>';
        }
      }
      
      // 格式化快速时间显示
      function formatQuickTime(date) {
        const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
        const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        const pad = n => n.toString().padStart(2, '0');
        return `${months[date.getMonth()]}${date.getDate()}日 ${days[date.getDay()]} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
      }
      
      // 获取倒计时文本
      function getCountdown(targetDate) {
        const now = new Date();
        const diff = targetDate - now;
        
        if (diff < 0) return null;
        
        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        
        if (days > 0) {
          return `${days}天后`;
        } else if (hours > 0) {
          return `${hours}小时后`;
        } else if (minutes > 0) {
          return `${minutes}分钟后`;
        } else {
          return '即将开始';
        }
      }
      
      // 复制密码功能
      function copyPassword() {
        const password = document.getElementById('passwordCode').textContent;
        const btn = document.querySelector('.copy-btn');
        
        navigator.clipboard.writeText(password).then(() => {
          const originalText = btn.textContent;
          btn.textContent = '✓ 已复制';
          btn.classList.add('copied');
          btn.disabled = true;
          
          setTimeout(() => {
            btn.textContent = originalText;
            btn.classList.remove('copied');
            btn.disabled = false;
          }, 3000);
        }).catch(err => {
          console.error('复制失败:', err);
        });
      }
      
      // 折叠/展开规则
      function toggleRules() {
        const content = document.getElementById('rulesContent');
        const icon = document.getElementById('rulesIcon');
        content.classList.toggle('expanded');
        icon.classList.toggle('expanded');
      }
      
          // 全局变量存储比赛数据
      let globalMatches = [];
      
      // 解析日期字符串（支持多种格式）- 全局函数
      function parseMatchDate(dateStr) {
        // 尝试标准格式：2025-10-28 18:00
        let date = new Date(dateStr);
        if (!isNaN(date.getTime())) {
          return date;
        }
        
        // 尝试格式：10/28 6:00 PM
        const match = dateStr.match(/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})\s*(AM|PM)?/i);
        if (match) {
          const month = parseInt(match[1]) - 1; // 月份从0开始
          const day = parseInt(match[2]);
          let hour = parseInt(match[3]);
          const minute = parseInt(match[4]);
          const meridiem = match[5];
          
          // 处理12小时制
          if (meridiem) {
            if (meridiem.toUpperCase() === 'PM' && hour !== 12) {
              hour += 12;
            } else if (meridiem.toUpperCase() === 'AM' && hour === 12) {
              hour = 0;
            }
          }
          
          // 假设是当前年份
          const year = new Date().getFullYear();
          return new Date(year, month, day, hour, minute);
        }
        
        return new Date(dateStr);
      }
      
      // 格式化日期 - 全局函数
      function formatDate(date) {
        const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
        const days = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
        return `${months[date.getMonth()]}${date.getDate()}日 ${days[date.getDay()]}`;
      }
      
      // 格式化时间 - 全局函数
      function formatTime(start, end) {
        const pad = n => n.toString().padStart(2, '0');
        return `${pad(start.getHours())}:${pad(start.getMinutes())} - ${pad(end.getHours())}:${pad(end.getMinutes())}`;
      }
      
      // 动态生成时间轴
          (function() {
      console.log('Script started');
      
      try {
        // 循环系列定义
        const recurringSeries = {
          {% for series in site.data.chess.recurring_series %}
          {{ series.id | jsonify }}: {

        // 处理比赛实例，合并系列信息

                { position: {{ prize.position | jsonify }}, amount: {{ prize.amount | jsonify }} }{% unless forloop.last %},{% endunless %}
                {% endfor %}
              {% endif %}
            ],
            {% endif %}
            link: {{ match.link | jsonify }},

                {% endfor %}
              {% endif %}
            ]
          }{% unless forloop.last %},{% endunless %}

        ];
      
        // 构建完整的比赛列表
        const matches = rawMatches.map(match => {
          if (match.seriesId && recurringSeries[match.seriesId]) {
            const series = recurringSeries[match.seriesId];
            const matchDate = new Date(match.date);
            const [startHour, startMinute] = series.startTime.split(':').map(Number);
            
            // 计算开始和结束时间
            const startTime = new Date(matchDate);
            startTime.setHours(startHour, startMinute, 0);
            
            const endTime = new Date(startTime);
            endTime.setHours(endTime.getHours() + Math.floor(series.durationHours));
            endTime.setMinutes(endTime.getMinutes() + (series.durationHours % 1) * 60);
            
            // 格式化时间为本地时间 YYYY-MM-DD HH:MM
            const pad = n => String(n).padStart(2, '0');
            const formatLocalTime = (date) => {
              return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())} ${pad(date.getHours())}:${pad(date.getMinutes())}`;
            };
            
            // 生成比赛名称
            let name = series.nameTemplate.replace('{season}', match.season);
            name = name.replace('{month}', (matchDate.getMonth() + 1) + '月');
            
            return {
              name: name,
              startTime: formatLocalTime(startTime),
              endTime: formatLocalTime(endTime),
              link: match.link,
              seriesId: match.seriesId,
              seriesName: series.displayName || match.seriesId,
              prizes: Array.isArray(series.prizes) ? series.prizes : [],
              winners: Array.isArray(match.winners) ? match.winners : []
            };
          } else {
            // 非系列比赛，保持原样
            return Object.assign({}, match, {
              prizes: Array.isArray(match.prizes) ? match.prizes : [],
              winners: Array.isArray(match.winners) ? match.winners : []
            });
          }
        });
      
        console.log('Matches loaded:', matches.length);
        console.log('Sample match with description:', matches.find(m => m.description));
        
        // 保存到全局变量
        globalMatches = matches;
        
        if (matches.length === 0) {
          document.getElementById('matchesTimeline').innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">♟️</div>
              <p>暂无比赛安排</p>
            </div>
          `;
          return;
        }
      
      const now = new Date();
      const timeline = document.getElementById('matchesTimeline');
      
      // 调试信息（可选）
      console.log('Current time:', now.toLocaleString('zh-CN'));
      console.log('Matches:', matches.map(m => ({
        name: m.name,
        startTime: parseMatchDate(m.startTime).toLocaleString('zh-CN'),
        endTime: parseMatchDate(m.endTime).toLocaleString('zh-CN'),
        isRunning: parseMatchDate(m.startTime) <= now && now < parseMatchDate(m.endTime),
        isPast: parseMatchDate(m.endTime) < now
      })));
      
      // 分类比赛
      const running = [];
      const upcoming = [];
      const past = [];
      
      matches.forEach(match => {
        const startTime = parseMatchDate(match.startTime);
        const endTime = parseMatchDate(match.endTime);
        if (endTime < now) {
          past.push(match);
        } else if (startTime <= now && now < endTime) {

        } else {
          upcoming.push(match);
        }

      // 按时间排序

            seriesMatches.get(match.seriesId).push(match);
          }
        });
      
        const renderedSeries = new Set();
      
        upcoming.forEach(match => {
          if (match.seriesId) {
            if (renderedSeries.has(match.seriesId)) {
              return;
            }
      
            const groupMatches = seriesMatches.get(match.seriesId) || [];
            const extras = groupMatches.slice(1);
            const toggleId = `series-extra-${match.seriesId}`;
            const seriesLabel = match.seriesName || (recurringSeries[match.seriesId]?.displayName) || match.seriesId.toUpperCase();
            const seriesIcon = recurringSeries[match.seriesId]?.icon || '';
      
            // 创建主卡片，如果有额外比赛则标记 hasExtras
            const cardOptions = extras.length > 0 ? {

              seriesLabel: seriesLabel,
              extrasCount: extras.length,

              seriesIcon: seriesIcon

            const matchItemDiv = document.createElement('div');

          upcomingGroup.appendChild(matchItemDiv.firstElementChild);

      if (past.length > 0) {
        const seriesLabelMap = {
          ec: (recurringSeries['ec']?.displayName || 'E.C.'),

        };
      
        // 规则：E.C. 小比赛；PRO LEAGUE 宏大；Champions 更大；特殊赛事不计分
        const basePoints = { first: 10, second: 6, third: 4 };
        const multiplier = { ec: 1, pro: 2, champions: 3 };
      
        const countsWins = { all: new Map(), ec: new Map(), pro: new Map(), champions: new Map() };
        const points = { all: new Map(), ec: new Map(), pro: new Map(), champions: new Map() };
      
        const norm = (s) => (s || '').trim().replace(/\s+/g, ' ');
      
        past.forEach(m => {
          const key = getSeriesKey(m);
          if (key === 'other' || m.special_type === 'special') return; // 特殊不计分
          const winners = Array.isArray(m.winners) ? m.winners : [];
          const w1 = winners.find(w => /🥇|第一/.test(w.position || ''));

          const w3 = winners.find(w => /🥉|第三/.test(w.position || ''));
      
          // 胜场统计（只统计🥇）
          if (w1 && w1.name) {
            const name = norm(w1.name);
            countsWins.all.set(name, (countsWins.all.get(name) || 0) + 1);
            if (countsWins[key]) countsWins[key].set(name, (countsWins[key].get(name) || 0) + 1);
          }
      
          // 积分统计（前三名，根据系列加权）
          const addP = (winner, posKey) => {
            if (!winner || !winner.name) return;
            const name = norm(winner.name);
            const add = (basePoints[posKey] || 0) * (multiplier[key] || 1);
            if (add <= 0) return;
            points.all.set(name, (points.all.get(name) || 0) + add);
            if (points[key]) points[key].set(name, (points[key].get(name) || 0) + add);
          };
          addP(w1, 'first');
          addP(w2, 'second');
          addP(w3, 'third');
        });
      
        const pastGroup = document.createElement('div');
        pastGroup.className = 'time-group';
        pastGroup.innerHTML = '<div class="time-label">🏆 已结束</div>';
      
        // 规则说明
        const rule = document.createElement('div');
        rule.className = 'rule-card';
        rule.innerHTML = `
          <h4>🎯 计分规则</h4>
          <ul>
            <li>仅统计 E.C. / PRO LEAGUE / Champions 三大系列，特殊赛事不参与积分。</li>
            <li>基础分（E.C.）：🥇10分、🥈6分、🥉4分。</li>
            <li>系列加权：PRO ×2；Champions ×3（例如：Champions 🥇=30分）。</li>
            <li>胜场榜：按「🥇第一名次数」排名（与积分无关）。</li>
            <li>名称按报名名单原样统计，若需合并同一选手不同写法，请统一姓名。</li>
          </ul>
        `;
        pastGroup.appendChild(rule);
      
        // 胜场榜（按系列切换）
        const availableSeries = ['all', 'ec', 'pro', 'champions'].filter(k => k === 'all' || countsWins[k].size > 0 || points[k].size > 0);
      
        // 模式切换：积分榜 / 胜场榜
        const modeHtml = `
          <div class="leaderboard-modes">
            <button class="mode-tab active" data-mode="points">积分榜</button>
            <button class="mode-tab" data-mode="wins">胜场榜</button>
          </div>
        `;
      
        const tabsHtml = availableSeries.map((k, i) => {
          const label = k === 'all' ? '全部' : seriesLabelMap[k] || k.toUpperCase();
          const active = i === 0 ? 'active' : '';
          return `<button class="leaderboard-tab ${active}" data-series="${k}">${label}</button>`;
        }).join('');
      
        const buildList = (map, unit) => {
          const arr = Array.from(map.entries()).sort((a, b) => b[1] - a[1]).slice(0, 10);
          return arr.map(([name, c], idx) => {
            const rankIcon = idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : (idx + 1);
            const value = unit === 'pts' ? `${c}` : `${c}`;
            return `<div class="leaderboard-item"><div class="lb-rank">${rankIcon}</div><div class="lb-name">${name}</div><div class="lb-count">${value}</div></div>`;
          }).join('') || '<div style="color:#b8c5d1; font-size:0.9em;">暂无数据</div>';
        };
      
        const pointsListsHtml = availableSeries.map((k, i) => {
          const active = i === 0 ? 'active' : '';
          return `<div class="leaderboard-list ${active}" data-mode="points" data-series="${k}">${buildList(points[k], 'pts')}</div>`;
        }).join('');
        const winsListsHtml = availableSeries.map((k, i) => {
          const active = i === 0 ? '' : '';
          return `<div class="leaderboard-list" data-mode="wins" data-series="${k}">${buildList(countsWins[k], 'wins')}</div>`;
        }).join('');
      
        const leaderboard = document.createElement('div');
        leaderboard.className = 'leaderboard-section';
        leaderboard.innerHTML = `
          <div class="leaderboard-title">🏅 排行（可切换模式）</div>
          ${modeHtml}
          <div class="leaderboard-tabs">${tabsHtml}</div>
          ${pointsListsHtml}
          ${winsListsHtml}
        `;
        pastGroup.appendChild(leaderboard);
      
        // 过去赛事紧凑卡片网格
        const grid = document.createElement('div');
        grid.className = 'past-grid';
        past.forEach(match => {
          const card = document.createElement('div');
          card.innerHTML = createPastCard(match);
          grid.appendChild(card.firstElementChild);
        });
        pastGroup.appendChild(grid);
      
        timeline.appendChild(pastGroup);
      
        // 绑定模式与系列切换
        const switchTo = (mode, series) => {
          pastGroup.querySelectorAll('.mode-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-mode') === mode));
          pastGroup.querySelectorAll('.leaderboard-tab').forEach(b => b.classList.toggle('active', b.getAttribute('data-series') === series));
          pastGroup.querySelectorAll('.leaderboard-list').forEach(list => {
            const ok = list.getAttribute('data-mode') === mode && list.getAttribute('data-series') === series;
            list.classList.toggle('active', ok);
          });
        };
      
        let currentMode = 'points';
        let currentSeries = availableSeries[0] || 'all';
        switchTo(currentMode, currentSeries);
      
        pastGroup.querySelectorAll('.mode-tab').forEach(btn => {
          btn.addEventListener('click', () => {
            currentMode = btn.getAttribute('data-mode');
            switchTo(currentMode, currentSeries);
          });
        });
      
        pastGroup.querySelectorAll('.leaderboard-tab').forEach(btn => {
          btn.addEventListener('click', () => {
            currentSeries = btn.getAttribute('data-series');
            switchTo(currentMode, currentSeries);
          });
        });
      }
      
      // 空状态
      if (matches.length === 0) {
        timeline.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">♟️</div>
            <p>暂无比赛安排</p>
          </div>
        `;
      }
      
      // 绑定系列折叠按钮（卡片内和独立）
      document.querySelectorAll('.series-toggle, .card-toggle-link').forEach(button => {
        button.addEventListener('click', () => {
          const targetId = button.getAttribute('data-target');
          const container = document.getElementById(targetId);
          if (!container) {
            return;
          }
      
          const expanded = button.getAttribute('data-expanded') === 'true';
          
          if (expanded) {
            // 收起
            container.classList.add('hidden');
          } else {
            // 展开
            container.classList.remove('hidden');
          }
      
          button.setAttribute('data-expanded', expanded ? 'false' : 'true');
      
          const seriesLabel = button.getAttribute('data-series-label') || '';
          const extrasCount = button.getAttribute('data-extras-count') || '';
          
          if (expanded) {
            button.textContent = `展开更多「${seriesLabel}」系列比赛 (${extrasCount})`;
          } else {
            button.textContent = `收起「${seriesLabel}」比赛`;
          }
        });
      });
      
      console.log('Timeline rendering complete');
      
      // 填充快速信息卡片
      setTimeout(() => {
        if (typeof populateQuickInfo === 'function') {
          populateQuickInfo();
        }
      }, 100);
      
      } catch (error) {
        console.error('Error rendering timeline:', error);
        document.getElementById('matchesTimeline').innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">⚠️</div>
            <p>加载比赛数据时出错</p>
            <p style="font-size: 0.85em; color: #888;">${error.message}</p>
          </div>
        `;
      }
      
      // 创建比赛卡片HTML
      function createMatchCard(match, isPast, options = {}) {
        const startDate = parseMatchDate(match.startTime);
        const endDate = parseMatchDate(match.endTime);
        const dateStr = formatDate(startDate);
        const timeStr = formatTime(startDate, endDate);
        const prizes = Array.isArray(match.prizes) ? match.prizes : [];
        const winners = Array.isArray(match.winners) ? match.winners : [];
        const { hasExtras = false, toggleId = '', seriesLabel = '', extrasCount = 0, seriesIcon = '' } = options;
        
        // 判断比赛类型
        let matchType = 'type-ec'; // 默认
        
        // 优先通过 seriesId 判断
        if (match.seriesId) {
          if (match.seriesId === 'champions') {
            matchType = 'type-champions';
          } else if (match.seriesId === 'pro') {
            matchType = 'type-pro';
          } else if (match.seriesId === 'ec') {
            matchType = 'type-ec';
          }
        } else {
          // 通过名称判断（兼容旧的特殊活动）
          if (match.name.includes('Champions')) {
            matchType = 'type-champions';
          } else if (match.name.includes('PRO LEAGUE')) {
            matchType = 'type-pro';
          } else if (match.name.includes('E.C.')) {
            matchType = 'type-ec';
          }
        }
        
        // 特殊类型覆盖（用于特殊活动）
        if (match.special_type) {
          matchType = `type-${match.special_type}`;
        }
        
        let prizesHTML = '';
        if (prizes.length > 0) {
          const totalPrize = prizes.reduce((sum, p) => {
            const amount = parseInt(p.amount.replace(/[^0-9]/g, '')) || 0;
            return sum + amount;
          }, 0);
          
          prizesHTML = `
            <div class="prize-info">
              <div class="prize-badge">💰 总奖金: ￥${totalPrize}</div>
              ${prizes.map(p => `<div class="prize-badge">${p.position} ${p.amount}</div>`).join('')}
            </div>
          `;
        }
      
        let winnersHTML = '';
        if (winners.length > 0 && isPast) {
          winnersHTML = `
            <div class="winners">
              <div class="winners-title">🎯 获奖名单</div>
              ${winners.map(w => {
                let prizeAmount = '';
                const prize = prizes.find(p => p.position === w.position);
                if (prize) {
                  prizeAmount = ` <span style="color: #ffd700;">(${prize.amount})</span>`;
                }
                return `<div class="winner-item">${w.position}: ${w.name}${prizeAmount}</div>`;
              }).join('')}
            </div>
          `;
        }
      
        let extrasHTML = '';
        if (hasExtras && toggleId) {
          extrasHTML = `
            <div class="card-extras-footer">
              <button class="card-toggle-link" data-target="${toggleId}" data-expanded="false" data-series-label="${seriesLabel}" data-extras-count="${extrasCount}">
                展开更多「${seriesLabel}」系列比赛 (${extrasCount})
              </button>
            </div>
          `;
        }
      
        let descriptionHTML = '';
        if (match.description) {
          // 简单的 markdown 转 HTML（支持 **粗体** 和 *斜体*）
          let desc = match.description;
          // 处理 | 作为段落分隔符
          desc = desc.split(' | ').join('</p><p>');
          desc = desc.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
          desc = desc.replace(/\*(.*?)\*/g, '<em>$1</em>');
          desc = desc.replace(/^### (.*?)$/gm, '<h4 style="color: #ffd700; margin: 12px 0 8px 0; font-size: 1em;">$1</h4>');
          desc = desc.replace(/^- (.*?)$/gm, '<li>$1</li>');
          desc = desc.replace(/(<li>.*?<\/li>)/s, '<ul>$1</ul>');
          
          descriptionHTML = `<div class="match-description"><p>${desc}</p></div>`;
        }
      
        const buttonHTML = isPast 
          ? `<a href="${match.link}" target="_blank" class="match-btn secondary">查看结果</a>`
          : `<a href="${match.link}" target="_blank" class="match-btn primary">立即报名</a>`;
      
        return `
          <div class="match-item">
            <div class="match-marker"></div>
            <div class="match-card ${matchType}">
              ${seriesIcon ? `<div class="card-icon">${seriesIcon}</div>` : ''}
              <div class="match-header">
                <div class="match-title">
                  <h3>${match.name}</h3>
                  <div class="match-time">${dateStr} ${timeStr}</div>
                </div>
                <div class="match-action">
                  ${buttonHTML}
                </div>
              </div>
              ${descriptionHTML}
              ${prizesHTML}
              ${winnersHTML}
              ${extrasHTML}
            </div>
          </div>
        `;
      }
      
      // 生成紧凑型过去赛事卡片
      function createPastCard(match) {
        const startDate = parseMatchDate(match.startTime);
        const endDate = parseMatchDate(match.endTime);
        const dateStr = formatDate(startDate);
        const timeStr = formatTime(startDate, endDate);
        const winners = Array.isArray(match.winners) ? match.winners : [];
        const w1 = winners.find(w => /🥇|第一/.test(w.position || ''));
        const w2 = winners.find(w => /🥈|第二/.test(w.position || ''));
        const w3 = winners.find(w => /🥉|第三/.test(w.position || ''));
        const link = match.link || '#';
        return `
          <div class="past-card">
            <div class="pc-title">${match.name}</div>
            <div class="pc-time">${dateStr} ${timeStr}</div>
            <div class="pc-winners">
              ${w1 ? `<span class="badge-win">🥇 ${w1.name}</span>` : `<span class="badge-3">暂无获奖信息</span>`}
              ${w2 ? `<span class="badge-2">🥈 ${w2.name}</span>` : ''}
              ${w3 ? `<span class="badge-3">🥉 ${w3.name}</span>` : ''}
            </div>
            <a class="pc-link" href="${link}" target="_blank" rel="noopener">查看结果 →</a>
          </div>
        `;
      }
      
      // 根据比赛推断系列键值（ec/pro/champions/other）
      function getSeriesKey(match) {
        if (match.seriesId) return match.seriesId;
        if (match.special_type) {
          if (match.special_type === 'champions') return 'champions';
        }
        const name = match.name || '';
        if (/E\.C\./i.test(name)) return 'ec';
        if (/PRO LEAGUE/i.test(name)) return 'pro';
        if (/Champions/i.test(name)) return 'champions';
        return 'other';
      }
          })();
      
          // 加载语言切换和UI按钮
          try {
      if (typeof load_ui_toggle_btn === 'function') {
        load_ui_toggle_btn('{{ page.language }}');
      }
          } catch (e) {
      console.log('Optional UI functions not available:', e);
          }
    </script>
  </body>

</html>
