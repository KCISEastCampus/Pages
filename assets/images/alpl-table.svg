  <title id="court-title">ALPL 蓝色乒乓球台</title>
  <desc id="court-desc">蓝色长方形球台以统一斜投影视角呈现，白色边线环绕桌面；球网横跨桌面中央并垂直竖起，由两侧网柱支撑，四条桌腿向下落地。一颗白色乒乓球位于近半场上方。</desc>
