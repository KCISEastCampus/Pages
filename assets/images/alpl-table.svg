      <stop stop-color="#fff"/><stop offset="0.6" stop-color="#f7f8f3"/><stop offset="1" stop-color="#d5dedb"/>
    </radialGradient>
    <radialGradient id="ground-shadow">
      <stop stop-color="#000" stop-opacity="0.24"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>
