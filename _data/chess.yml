# ============================================
# KC Gaming Chess — 数据配置文件（唯一数据源）
# 修改此文件即可更新页面，无需改代码
# ============================================

# ---------- 站点配置 ----------
config:
  title: "KC Gaming Chess"
  subtitle: "昆山康桥学校 A-Level 国际象棋竞技活动"
  password: "KangChiaoInternationalSchool"  # 所有比赛统一密码（唯一来源）
  password_hint: "所有比赛使用相同密码，点击复制"
  contact_email: "info@kcisec.site"
  lichess_tv: true      # 是否在概览页显示 LiChess TV
  hero_icon: "♞"
  current_season: 2     # 当前赛季：排行榜只统计本赛季
  season_label: "S2"
  stats:                # 概览页头部战绩数据（可手动维护）
    - label: "已举办赛事"
      value: "7"
    - label: "参赛棋手"
      value: "20+"
    - label: "总奖池"
      value: "￥80+"

# ---------- 系列定义（可配置） ----------
# weight 用于排行榜积分加权（自动计算积分时使用）
# format 标注赛制：arena（锦标赛，随时开打）/ swiss（瑞士制，需战队）
# time_control 为推荐建赛参数
series:
  - id: "ec"
    name: "E.C. 系列"
    full_name: "KC Gaming Chess E.C. Season {season}"
    icon: "♟️"
    badge: "每周一次"
    description: "每周晚自习时间举办，面向所有人群的基础赛事。"
    weight: 1
    color: "bronze"
    format: "arena"
    time_control: "15+10"     # 每方15分钟+10秒增时
    duration_hours: 2
    prize:
      - { rank: 1, label: "🥇 第一名", amount: "￥10" }
      - { rank: 2, label: "🥈 第二名", amount: "￥3" }
      - { rank: 3, label: "🥉 第三名", amount: "￥2" }

  - id: "pro"
    name: "PRO LEAGUE"
    full_name: "KC Gaming Chess PRO LEAGUE S{season}"
    icon: "⭐"
    badge: "每两周一次"
    description: "每两周举办一次，面向进阶棋手的专业联赛。"
    weight: 2
    color: "silver"
    format: "arena"
    time_control: "10+5"      # 每方10分钟+5秒增时
    duration_hours: 2
    prize:
      - { rank: 1, label: "🥇 第一名", amount: "￥10" }
      - { rank: 2, label: "🥈 第二名", amount: "￥3" }
      - { rank: 3, label: "🥉 第三名", amount: "￥2" }

  - id: "champions"
    name: "Champions"
    full_name: "KC Gaming Chess Champions {month}"
    icon: "👑"
    badge: "每两月一次"
    description: "每两个月举办一次，最高级别赛事。"
    weight: 4                # S2 加权上调：突出顶级赛事价值
    color: "gold"
    format: "arena"
    time_control: "20+10"     # 每方20分钟+10秒增时
    duration_hours: 2
    prize:
      - { rank: 1, label: "🥇 第一名", amount: "￥15" }
      - { rank: 2, label: "🥈 第二名", amount: "￥10" }
      - { rank: 3, label: "🥉 第三名", amount: "￥5" }

# ---------- 计分规则（可配置，排行榜自动计算时使用） ----------
scoring:
  enabled: true                  # 是否启用积分/胜场榜
  base_points:                   # 基础分（按名次）
    first: 10
    second: 6
    third: 4
  weight_map:                    # 系列加权（与 series.weight 保持一致）
    ec: 1
    pro: 2
    champions: 4
  points_label: "积分"
  wins_label: "胜场"
  top_n: 10                      # 排行榜显示前 N 名
  rule_note: |
    计分规则：仅统计 E.C. / PRO LEAGUE / Champions 三大系列，特殊赛事不参与积分。
    基础分（E.C.）：🥇10分、🥈6分、🥉4分；
    系列加权：PRO ×2、Champions ×4。

# ---------- 赛季说明 ----------
seasons:
  - id: 1
    label: "S1 · 2025-2026"
    note: "历史赛季，已归档。排行榜不再计算，可在赛程中查看。"
  - id: 2
    label: "S2 · 当前赛季"
    note: "当前赛季。排行榜只统计本赛季比赛。"
    # S2 系列架构沿用上方 series 定义（含新权重 Champions×4、新时限参数）。
    # 后续在 matches 里添加 ssn: 2 的比赛即可自动入榜。

