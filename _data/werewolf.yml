# ============================================
# 狼人杀中控台 — 数据配置（唯一数据源）
# 修改此文件即可更新玩法，无需改代码
# 配合 assets/js/werewolf.js 与 _layouts/werewolf.html 使用
# ============================================

config:
  title: "狼人杀中控台"
  subtitle: "KC Gaming · 主持人专用"

# ---------- 规则变体（村规选项） ----------
# 主持人可在开局前选择，应对不同地方的规则分歧
rule_variants:
  - id: witch_self_save
    name: 女巫自救
    description: 女巫是否可以用解药救自己
    options:
      - id: no_self_save
        name: 全程不可自救
        default: true
        rule: "女巫在整个游戏过程中不能使用解药救自己"
      - id: first_night_only
        name: 仅首夜可自救
        rule: "女巫仅在第一个夜晚可以用解药救自己，之后不可"
      - id: always_self_save
        name: 全程可自救
        rule: "女巫在任何夜晚都可以用解药救自己"

  - id: guard_witch_conflict
    name: 守救同体
    description: 守卫和女巫同时救同一人时的结算
    options:
      - id: conflict_death
        name: 启用（奶死）
        default: true
        rule: "守卫守护与女巫解药同时作用于同一人时，该玩家死亡且解药消耗"
      - id: conflict_independent
        name: 禁用（各自生效）
        rule: "守卫和女巫各自独立判断，不产生冲突"

  - id: hunter_poisoned
    name: 猎人被毒
    description: 猎人被女巫毒杀后是否可以开枪
    options:
      - id: no_shoot
        name: 不能开枪
        default: true
        rule: "猎人被女巫毒杀后不能开枪"
      - id: can_shoot
        name: 可以开枪
        rule: "猎人被女巫毒杀后仍然可以开枪带走一名玩家"

  - id: langwang_exile
    name: 白狼王放逐
    description: 白狼王被投票放逐时是否可以自爆带人
    options:
      - id: exile_explode
        name: 可自爆带人
        default: true
        rule: "白狼王被投票放逐时，可选择自爆带走一名好人"
      - id: exile_no_explode
        name: 不能自爆
        rule: "白狼王被投票放逐时直接出局，不能自爆带人"

  - id: witch_double_use
    name: 女巫双药
    description: 女巫同一夜晚是否可以同时使用解药和毒药
    options:
      - id: no_double
        name: 不可双用
        default: true
        rule: "女巫在同一夜晚只能使用解药或毒药中的一种"
      - id: allow_double
        name: 可以双用
        rule: "女巫在同一夜晚可以同时使用解药和毒药"

