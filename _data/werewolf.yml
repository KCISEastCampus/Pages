# ---------- 角色元数据 ----------
roles:
  狼人:
    camp: 狼
    night: true
    active: true
    text: "狼人请睁眼，互相确认，选择今晚要袭击的目标"
  白狼王:
    camp: 狼
    night: false
    active: true
    text: "白狼王白天可自爆，带走一名好人后直接进入黑夜"
  预言家:
    camp: 神
    night: true
    active: true
    text: "预言家请睁眼，选择一名玩家查验身份"
  女巫:
    camp: 神
    night: true
    active: true
    text: "女巫请睁眼，选择【救人】或【毒人】（一瓶解药、一瓶毒药）"
  猎人:
    camp: 神
    night: false
    active: true
    text: "猎人被狼刀、守救同体或放逐出局时可开枪带走一名玩家；被毒时按本局规则执行，被白狼王带走时不能开枪"
  守卫:
    camp: 神
    night: true
    active: true
    text: "守卫请睁眼，选择守护一名玩家（不可连续两晚守同一人）"
  白痴:
    camp: 神
    night: false
    active: false
    text: "白痴白天被放逐后可翻牌免死，但不能投票"
  平民:
    camp: 民
    night: false
    active: false
    text: "平民请睁眼，白天参与讨论与投票"

# ---------- 夜间时序模板 ----------
night_orders:
  standard: [狼人, 女巫, 预言家]          # 预女猎白（无守卫）
  with_guard: [守卫, 狼人, 女巫, 预言家]   # 带守卫板

# ---------- 进阶板子（主持人可手动切换） ----------
boards:
  - id: standard_12
    name: "预女猎白 · 标准"
